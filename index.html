<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Volume do Áudio</title>
  <style>
    /* Estilização moderna e limpa para o controle de áudio */
    .audio-control-container {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background-color: #1e1e24;
      color: #ffffff;
      border-radius: 8px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .audio-control-container label {
      font-size: 14px;
      font-weight: 600;
      user-select: none;
    }

    .volume-display {
      min-width: 24px;
      font-weight: bold;
      color: #00e676;
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 6px;
      background: #424242;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e676;
      cursor: pointer;
      transition: transform 0.1s ease-in-out;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00e676;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Componente de Controle de Volume -->
  <div class="audio-control-container">
    <label for="volumeSlider">Volume:</label>
    <input 
      type="range" 
      id="volumeSlider" 
      min="0" 
      max="15" 
      step="1" 
      value="15"
    >
    <span id="volumeDisplay" class="volume-display">15</span>
  </div>

  <!-- Elemento de Áudio (Substitua 'seu-audio.mp3' pelo caminho do seu arquivo) -->
  <audio id="meuAudio" src="seu-audio.mp3" preload="auto"></audio>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('meuAudio');
      const volumeSlider = document.getElementById('volumeSlider');
      const volumeDisplay = document.getElementById('volumeDisplay');

      // 1. Carrega o volume salvo no localStorage (se existir), caso contrário usa 15 como padrão
      const volumeSalvo = localStorage.getItem('app_audio_volume');
      const volumeInicial = volumeSalvo !== null ? parseInt(volumeSalvo, 10) : 15;

      // 2. Aplica o volume inicial nos elementos
      atualizarVolume(volumeInicial);

      // 3. Evento para capturar a mudança de volume em tempo real
      volumeSlider.addEventListener('input', (e) => {
        const novoVolume = parseInt(e.target.value, 10);
        atualizarVolume(novoVolume);
        // Persiste a escolha do usuário
        localStorage.setItem('app_audio_volume', novoVolume);
      });

      // Função responsável por converter a escala 0-15 e aplicar ao elemento de áudio
      function atualizarVolume(nivel) {
        // Garante que o valor fique dentro dos limites 0 e 15
        const nivelValidado = Math.max(0, Math.min(15, nivel));
        
        // Atualiza a posição do slider e a label visual
        volumeSlider.value = nivelValidado;
        volumeDisplay.textContent = nivelValidado;

        // Converte a escala de 0..15 para a escala do HTML5 (0.0 até 1.0)
        audio.volume = nivelValidado / 15;
      }
    });
  </script>

</body>
</html>
